name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }})
    # The runtime spawns processes, picks ports and joins paths, which differ by system.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    env:
      # The unit tests never launch Electron, so skip its 100 MB runtime download.
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22' # the minimum in package.json engines
          cache: 'npm'
      - run: npm ci
      # Fails if any covered file drops below 100% (vitest.config.mjs).
      - run: npm run test:coverage
      - name: Add coverage to the job summary
        if: always() && matrix.os == 'ubuntu-latest' && hashFiles('coverage/coverage-summary.json') != ''
        run: node scripts/coverage-summary.mjs >> "$GITHUB_STEP_SUMMARY"
      - name: Upload the HTML coverage report
        if: always() && matrix.os == 'ubuntu-latest' && hashFiles('coverage/index.html') != ''
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          retention-days: 14
